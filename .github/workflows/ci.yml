name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, gd, curl
          coverage: none

      - name: Lint plugin PHP
        run: |
          find . -name '*.php' -not -path './pdf/lib/vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Lint bundled dompdf
        run: find pdf/lib/vendor -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check JavaScript syntax
        run: node --check views/js/fiken.js

      - name: Tests
        run: php tests/run.php
